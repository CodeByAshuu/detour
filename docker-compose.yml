services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - auth-service
      - core-service
      - routing-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"

  auth-service:
    build:
      context: ./server/auth-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - ./server/auth-service/.env
    depends_on:
      - mongodb

  core-service:
    build:
      context: ./server/core-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - ./server/core-service/.env
    depends_on:
      - mongodb

  routing-service:
    build:
      context: ./server/routing-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    env_file:
      - ./server/routing-service/.env
    depends_on:
      - redis

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
