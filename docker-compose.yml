version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - auth-service
      - core-service
      - routing-service

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost/api

  auth-service:
    build:
      context: ./server/auth-service
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/detour}
      - JWT_SECRET=${JWT_SECRET:-devsecret_please_change}
    depends_on:
      - mongodb

  core-service:
    build:
      context: ./server/core-service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/detour}
      - JWT_SECRET=${JWT_SECRET:-devsecret_please_change}
    depends_on:
      - mongodb

  routing-service:
    build:
      context: ./server/routing-service
      dockerfile: Dockerfile
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    depends_on:
      - redis

  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
